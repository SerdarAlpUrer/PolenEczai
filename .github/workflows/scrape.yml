name: Eczane Verisi Guncelle

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "data.json"
      - "README.md"
  schedule:
    # Saat basi (:00) yogunlugundan kacinmak icin ara dakikalarda her 2 saatte bir kontrol
    - cron: "23 */2 * * *"
    # Sabah nobet degisimi (08:30 TSI = 05:30 UTC) sonrasi yogun kontrol
    - cron: "35,52 5 * * *"
    - cron: "15,45 6 * * *"
    # Aksam nobet degisimi (18:00-18:30 TSI = 15:00-15:30 UTC) sonrasi yogun kontrol
    - cron: "10,35,52 15 * * *"
    - cron: "15,45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-pharmacy-data
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Eczane verisini ve 5 gunluk takvimi cek
        run: python scraper.py

      - name: Degisiklikleri cakismasiz olarak kaydet ve gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Veri ayni, degisiklik yok."
            exit 0
          fi
          git commit -m "🚀 Oto-Guncelleme: Guncel eczane verisi cekildi"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push denemesi $i basarisiz, 5 sn sonra tekrar deneniyor..."
            sleep 5
          done
